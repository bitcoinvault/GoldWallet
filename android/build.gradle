// Top-level build file where you can add configuration options common to all sub-projects/modules.

def currentJavaMajorVersion = JavaVersion.current().majorVersion.toInteger()
if (currentJavaMajorVersion != 17) {
    throw new GradleException("GoldWallet Android build requires JDK 17 for React Native 0.87 and AGP 9.2. Current JDK is ${JavaVersion.current()}. Set JAVA_HOME to JDK 17 before running Gradle.")
}

buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 26
        compileSdkVersion = 37
        targetSdkVersion = 36
        supportLibVersion = "28.0.0"
        kotlinVersion = '2.2.10'
        kspVersion = '2.2.10-2.0.2'
        ndkVersion = "27.1.12297006"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:9.2.1")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath 'com.google.gms:google-services:4.5.0'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.7'
        classpath("com.google.android.gms:strict-version-matcher-plugin:1.2.4")


        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            url("$rootDir/../node_modules/detox/Detox-android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        maven { url 'https://www.jitpack.io' }

        google()
        mavenCentral()
    }
}
