// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "33.0.2"
        minSdkVersion = 26
        compileSdkVersion = 34
        targetSdkVersion = 34
        supportLibVersion = "28.0.0"
        googlePlayServicesVersion = "17.0.0"
        googlePlayServicesIidVersion = "17.0.0"
        googlePlayServicesVisionVersion = "20.1.3"
        firebaseVersion = "32.7.0"
        kotlinVersion = '1.8.0'
        ndkVersion = "25.1.8937393"
        blurViewVersion = "2.0.6"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:7.4.2")
        classpath 'com.google.gms:google-services:4.3.15'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.5'
        classpath("com.google.android.gms:strict-version-matcher-plugin:1.2.4")
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        mavenLocal()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            url("$rootDir/../node_modules/detox/Detox-android")
        }
        maven {
            // Android JSC is installed from npm
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        maven { url "https://jitpack.io" }
        google()
        mavenCentral()
    }
    
    // Wykluczamy problematyczne moduły
    configurations.all {
        exclude group: 'com.github.Dimezis', module: 'BlurView'
        exclude module: 'react-native-community_blur'
        exclude module: 'react-native-screens'
    }
}
