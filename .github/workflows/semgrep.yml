name: Semgrep

on:
  push:
    branches: [develop, main, stage]
  pull_request:
    branches: [develop, main, stage]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          rm -f semgrep.sarif
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/src" \
            --workdir /src \
            semgrep/semgrep:1.170.0@sha256:c98f8829eea377274ee4b10656458b078b88232469b2ff913f091c2317347c9d \
          semgrep scan \
            --sarif \
            --output semgrep.sarif \
            --disable-nosem \
            --x-ignore-semgrepignore-files \
            --config p/security-audit \
            --config p/typescript \
            --config p/insecure-transport \
            --config p/command-injection \
            --config p/secrets \
            --config p/react \
            --config p/owasp-top-ten \
            .

      - name: Check out trusted Semgrep policy
        if: always()
        id: semgrep_policy_checkout
        continue-on-error: true
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .semgrep-policy
          persist-credentials: false

      - name: Prepare trusted Semgrep checker
        if: always()
        id: semgrep_policy
        continue-on-error: true
        env:
          TRUSTED_CHECKOUT_OUTCOME: ${{ steps.semgrep_policy_checkout.outcome }}
        run: |
          if [ "$TRUSTED_CHECKOUT_OUTCOME" != "success" ]; then
            exit 1
          fi
          if [ -f .semgrep-policy/scripts/checkSemgrepSarifBaseline.mjs ]; then
            exit 0
          fi
          echo "1eb26e84a9c452ddcfbb1ee75999313cfacca0954540dfe63103278e7d130e97  scripts/checkSemgrepSarifBaseline.mjs" | sha256sum --check -
          mkdir -p .semgrep-policy/scripts
          cp scripts/checkSemgrepSarifBaseline.mjs .semgrep-policy/scripts/checkSemgrepSarifBaseline.mjs

      - name: Check Semgrep SARIF baseline
        id: semgrep_baseline
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        run: node .semgrep-policy/scripts/checkSemgrepSarifBaseline.mjs semgrep.sarif .github/semgrep-baseline.json

      - name: Upload SARIF to GitHub code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: semgrep.sarif

      - name: Retain Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Semgrep result
        if: always() && (steps.semgrep.outcome != 'success' || steps.semgrep_policy_checkout.outcome != 'success' || steps.semgrep_policy.outcome != 'success' || steps.semgrep_baseline.outcome != 'success')
        run: exit 1
